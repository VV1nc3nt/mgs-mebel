# Local development database. Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mgs
      POSTGRES_PASSWORD: mgs
      POSTGRES_DB: mgs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mgs -d mgs']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
