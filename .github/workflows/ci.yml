name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Production builds use the committed import map and types: fail if they are stale.
      - name: Check generated Payload files
        run: |
          pnpm payload generate:importmap
          pnpm generate:types
          git diff --exit-code -- 'src/app/(payload)/admin/importMap.js' src/payload-types.ts

      - run: pnpm lint
      - run: pnpm tsc --noEmit
      # No database here: the build must not need one.
      - run: pnpm build
      - run: pnpm test:unit

      # Standalone server laid out as in the Dockerfile (public/ and .next/static next to server.js).
      # tar keeps pnpm symlinks and file modes, which upload-artifact would lose.
      - name: Pack standalone build
        run: |
          mkdir -p public
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -cf standalone.tar -C .next standalone
      - uses: actions/upload-artifact@v7
        with:
          name: standalone
          path: standalone.tar
          retention-days: 1

  migrate:
    name: Migrations, schema drift, integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mgs
          POSTGRES_PASSWORD: mgs
          POSTGRES_DB: mgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgs -d mgs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mgs:mgs@localhost:5432/mgs
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate
      - run: pnpm payload migrate:status

      # migrate:create diffs the config against the latest snapshot in src/migrations:
      # a new file means the schema changed without a migration.
      - name: Check schema drift
        run: |
          pnpm payload migrate:create drift_check --skip-empty
          if [ -n "$(git status --porcelain -- src/migrations)" ]; then
            git status --porcelain -- src/migrations
            echo "::error::Schema differs from migrations. Run: pnpm payload migrate:create <name>"
            exit 1
          fi

      - run: pnpm test:int

  ui-kit:
    name: UI kit (Playwright on the standalone build)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mgs
          POSTGRES_PASSWORD: mgs
          POSTGRES_DB: mgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgs -d mgs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mgs:mgs@localhost:5432/mgs
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: standalone
      - run: mkdir -p .next && tar -xf standalone.tar -C .next

      # The server applies migrations on start (prodMigrations); no seed here, so media is empty
      # and the page must degrade gracefully.
      - name: /ui-kit is 404 without ENABLE_UI_KIT
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:3000/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ui-kit)
          kill %1
          echo "GET /ui-kit → $code"
          if [ "$code" != 404 ]; then cat server.log; exit 1; fi

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e tests/e2e/ui-kit.e2e.spec.ts --reporter=list
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-kit-screenshots
          path: test-results/
          retention-days: 7
