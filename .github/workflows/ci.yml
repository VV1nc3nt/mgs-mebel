name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Production builds use the committed import map and types: fail if they are stale.
      - name: Check generated Payload files
        run: |
          pnpm payload generate:importmap
          pnpm generate:types
          git diff --exit-code -- 'src/app/(payload)/admin/importMap.js' src/payload-types.ts

      - run: pnpm lint
      - run: pnpm tsc --noEmit
      # No database here: the build must not need one.
      - run: pnpm build

  migrate:
    name: Migrations on empty DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mgs
          POSTGRES_PASSWORD: mgs
          POSTGRES_DB: mgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgs -d mgs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mgs:mgs@localhost:5432/mgs
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate
