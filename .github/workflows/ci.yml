name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  # E2E specs per shard, balanced by run time; shard 1 also runs the 404 check and the @empty pass.
  # Every tests/e2e/*.spec.ts goes into exactly one list (checked by the E2E job).
  E2E_SHARD_1: >-
    tests/e2e/menu.e2e.spec.ts
    tests/e2e/ui-kit.e2e.spec.ts
    tests/e2e/about.e2e.spec.ts
    tests/e2e/not-found.e2e.spec.ts
    tests/e2e/header.e2e.spec.ts
  E2E_SHARD_2: >-
    tests/e2e/layout.e2e.spec.ts
    tests/e2e/dock.e2e.spec.ts
    tests/e2e/contact.e2e.spec.ts
    tests/e2e/home.e2e.spec.ts
    tests/e2e/preview.e2e.spec.ts
    tests/e2e/news-slug.e2e.spec.ts
  # Scaffold specs, not run in CI.
  E2E_NOT_IN_CI: >-
    tests/e2e/admin.e2e.spec.ts
    tests/e2e/frontend.e2e.spec.ts

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Production builds use the committed import map and types: fail if they are stale.
      - name: Check generated Payload files
        run: |
          pnpm payload generate:importmap
          pnpm generate:types
          git diff --exit-code -- 'src/app/(payload)/admin/importMap.js' src/payload-types.ts

      - run: pnpm lint
      - run: pnpm tsc --noEmit
      # No database here: the build must not need one.
      - run: pnpm build
      - run: pnpm test:unit

      # Standalone server laid out as in the Dockerfile (public/ and .next/static next to server.js).
      # tar keeps pnpm symlinks and file modes, which upload-artifact would lose.
      - name: Pack standalone build
        run: |
          mkdir -p public
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -cf standalone.tar -C .next standalone
      - uses: actions/upload-artifact@v7
        with:
          name: standalone
          path: standalone.tar
          retention-days: 1

  migrate:
    name: Migrations, schema drift, integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mgs
          POSTGRES_PASSWORD: mgs
          POSTGRES_DB: mgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgs -d mgs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mgs:mgs@localhost:5432/mgs
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm payload migrate
      - run: pnpm payload migrate:status

      # migrate:create diffs the config against the latest snapshot in src/migrations:
      # a new file means the schema changed without a migration.
      - name: Check schema drift
        run: |
          pnpm payload migrate:create drift_check --skip-empty
          if [ -n "$(git status --porcelain -- src/migrations)" ]; then
            git status --porcelain -- src/migrations
            echo "::error::Schema differs from migrations. Run: pnpm payload migrate:create <name>"
            exit 1
          fi

      - run: pnpm test:int

  e2e-shard:
    name: E2E ${{ matrix.shard }}/2 (Playwright on the standalone build)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mgs
          POSTGRES_PASSWORD: mgs
          POSTGRES_DB: mgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgs -d mgs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mgs:mgs@localhost:5432/mgs
      PAYLOAD_SECRET: ci-only-secret
      # One media directory for the fixture scripts (repo root) and the standalone server, which
      # changes its working directory to .next/standalone.
      MEDIA_DIR: ${{ github.workspace }}/e2e-media
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: standalone
      - run: mkdir -p .next && tar -xf standalone.tar -C .next

      # Browsers are cached per Playwright version; system packages are not, so they are
      # installed on a cache hit too.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # The server applies migrations on start (prodMigrations); no seed here, so media is empty
      # and the page must degrade gracefully.
      # /ui-kit: notFound() → (frontend)/not-found.tsx; an unmatched URL → global-not-found.tsx.
      # notFound() before the shell leaves the HTML body to the client, so only its <title> is
      # checked here; the unmatched URL is rendered on the server in full.
      - name: 404 pages without ENABLE_UI_KIT
        if: matrix.shard == 1
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:3000/healthz && break; sleep 1; done
          fail=0
          check() {
            code=$(curl -s -o page.html -w '%{http_code}' "http://127.0.0.1:3000$1")
            echo "GET $1 → $code"
            [ "$code" = 404 ] && grep -q "$2" page.html || { echo "expected 404 with: $2"; fail=1; }
          }
          check /ui-kit '<title>Страница не найдена — MGS MEBEL</title>'
          check /nesushchestvuet '<h1[^>]*>Страница не найдена</h1>'
          kill %1
          if [ "$fail" != 0 ]; then cat server.log; exit 1; fi

      # Fresh database: header and footer must render from empty globals.
      - name: Layout on empty globals
        if: matrix.shard == 1
        run: pnpm test:e2e tests/e2e/layout.e2e.spec.ts tests/e2e/dock.e2e.spec.ts tests/e2e/not-found.e2e.spec.ts tests/e2e/preview.e2e.spec.ts tests/e2e/home.e2e.spec.ts tests/e2e/about.e2e.spec.ts tests/e2e/news-slug.e2e.spec.ts --grep @empty --reporter=list
        env:
          E2E_EMPTY_DB: 1

      # The data cache of the empty-database server run is dropped so the fixture texts are read.
      - name: Drop the data cache of the empty run
        if: matrix.shard == 1
        run: rm -rf .next/standalone/.next/cache

      # No server has run on this database yet: the fixture needs the tables.
      - name: Migrations
        if: matrix.shard != 1
        run: pnpm payload migrate

      # Layout and settings texts from the seed, no media, and an editor account; the home page
      # with generated images (seedHome). NODE_ENV=production keeps Payload from
      # pushing the schema, which would make the next server start ask about migrations.
      - name: Layout and settings fixture
        run: |
          pnpm payload run tests/helpers/seedChrome.ts
          pnpm payload run tests/helpers/seedHome.ts
        env:
          NODE_ENV: production

      - name: E2E shard ${{ matrix.shard }}
        run: |
          files="E2E_SHARD_${{ matrix.shard }}"
          pnpm test:e2e ${!files} --grep-invert @empty --reporter=list
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One status for all shards; also fails when a spec is in no shard list or in both.
  e2e:
    name: E2E
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/e2e
      - name: Every spec in exactly one shard
        run: |
          listed=$(printf '%s\n' $E2E_SHARD_1 $E2E_SHARD_2 $E2E_NOT_IN_CI | sort)
          dupes=$(printf '%s\n' "$listed" | uniq -d)
          missing=$(comm -23 <(ls tests/e2e/*.spec.ts | sort) <(printf '%s\n' "$listed" | sort -u))
          unknown=$(comm -13 <(ls tests/e2e/*.spec.ts | sort) <(printf '%s\n' "$listed" | sort -u))
          fail=0
          for f in $missing; do echo "::error file=$f::$f is in no E2E shard: add it to E2E_SHARD_1 or E2E_SHARD_2 in .github/workflows/ci.yml"; fail=1; done
          for f in $dupes; do echo "::error file=$f::$f is listed more than once in E2E_SHARD_1 / E2E_SHARD_2 / E2E_NOT_IN_CI"; fail=1; done
          for f in $unknown; do echo "::error::$f is listed in .github/workflows/ci.yml but does not exist"; fail=1; done
          exit $fail
      - name: All shards passed
        run: |
          echo "e2e-shard: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = success ]
