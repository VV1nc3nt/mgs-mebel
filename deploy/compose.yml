# Staging stack. Lives in /opt/mgs on the server next to .env (see docs/deploy.md).
# Fixed project name → predictable volume names (mgs_pgdata, mgs_media, ...).
name: mgs

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USER is required}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?BASIC_AUTH_HASH is required}
    volumes:
      # Directory mount: an updated Caddyfile (replaced via mv) is visible to `caddy reload`.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  app:
    image: ${APP_IMAGE:-ghcr.io/vv1nc3nt/mgs-mebel}:${APP_TAG:-staging}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Site origin at run time (canonical, Open Graph, JSON-LD, Live Preview). Empty: the
      # NEXT_PUBLIC_SITE_URL the image was built with.
      SITE_URL: ${SITE_URL:-}
      # UI sandbox /ui-kit (staging only): read per request, see docs/deploy.md
      ENABLE_UI_KIT: ${ENABLE_UI_KIT:-}
    volumes:
      - media:/app/media
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging: *logging

  # Demo content, run only by seed.sh: `docker compose --profile seed run --rm seed`.
  # Image of the same commit as app (built by the "Seed staging" workflow); files come only from ./seed-cache.
  seed:
    profiles: [seed]
    image: ${APP_IMAGE:-ghcr.io/vv1nc3nt/mgs-mebel}:seed-${APP_TAG:-staging}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MEDIA_DIR: /app/media
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-}
      SEED_OFFLINE: 'true'
      SEED_CACHE_DIR: /seed-cache
      SEED_RESET: ${SEED_RESET:-false}
    volumes:
      - media:/app/media
      - ./seed-cache:/seed-cache:ro
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
